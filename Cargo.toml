[workspace]
resolver = "2"
members = [
    "crates/qr_transport",
    "crates/desktop_camera",
    "crates/minifrost_wire",
    "crates/minifrost_signer",
    "crates/minifrost_coordinator",
]

[workspace.dependencies]
bincode = { version = "2.0.1", features = ["serde", "alloc", "derive"], default-features = false }
serde = { version = "1", features = ["derive", "alloc"], default-features = false }
frostsnap_core = { git = "https://github.com/frostsnap/frostsnap", rev = "14446c811fa0c86714a2080ef7a107afea96e863", default-features = false }
# Same rev as frostsnap_core. The 25-word share backup format; `cli` (the default) is not wanted.
frost_backup = { git = "https://github.com/frostsnap/frostsnap", rev = "14446c811fa0c86714a2080ef7a107afea96e863", default-features = false }
rusqlite = { version = "0.31.0", features = ["bundled"] }
proptest = "=1.6.0"
rand_chacha = { version = "0.3", default-features = false }
sha2 = { version = "0.10", default-features = false }
bitcoin = { version = "0.32", features = ["serde"], default-features = false }
secp256kfun = { version = "0.12", default-features = false }
schnorr_fun = { version = "0.13", default-features = false }
rand_core = "0.6"
rand = "0.8"
tracing = { version = "0.1", default-features = false }

[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
